[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbitllm"
version = "2.11.0"
description = "RabbitLLM allows single 4GB GPU card to run 70B large language models without quantization, distillation or pruning. 8GB vmem to run 405B Llama3.1."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Manuel S. Lemos", email = "im@manuelslemos.es" }
]
urls = { Homepage = "https://github.com/lyogavin/rabbitllm" }
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "torch>=2.5,<2.6",
    "transformers>=5.0,<5.1",
    "accelerate>=1.1.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
    "scipy",
    "transformers-stream-generator>=0.0.5",
    "tiktoken>=0.12.0",
    "einops>=0.8.2",
    "sentencepiece>=0.1.99",
    "bitsandbytes>=0.49.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
compression = ["bitsandbytes"]
flash = ["flash-attn>=2.5"]
server = []
dev = ["ruff", "pytest", "pytest-cov", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/rabbitllm"]

# flash-attn needs torch at build time when built from source (no prebuilt wheel)
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
